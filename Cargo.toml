[package]
name = "frameforge"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Configurable video research and parsing pipeline"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
