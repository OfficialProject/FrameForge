name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: frameforge.exe
            archive: FrameForge-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: frameforge
            archive: FrameForge-linux-x64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: frameforge
            archive: FrameForge-macos-x64.tar.gz
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: frameforge
            archive: FrameForge-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable action
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify release binary
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --help

      - name: Prepare Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FrameForge | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/FrameForge/${{ matrix.binary }}"
          Copy-Item "profiles" "dist/FrameForge/profiles" -Recurse
          Copy-Item "sources.txt" "dist/FrameForge/sources.txt"
          Copy-Item "README.md" "dist/FrameForge/README.md"
          Copy-Item "LICENSE" "dist/FrameForge/LICENSE"
          Compress-Archive -Path "dist/FrameForge" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Prepare Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/FrameForge
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/FrameForge/${{ matrix.binary }}"
          cp -R profiles "dist/FrameForge/profiles"
          cp sources.txt README.md LICENSE "dist/FrameForge/"
          tar -C dist -czf "dist/${{ matrix.archive }}" FrameForge

      - name: Smoke-test packaged executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "FrameForge smoke package"
          $tools = Join-Path $env:RUNNER_TEMP "FrameForge smoke tools"
          $cwd = Join-Path $env:RUNNER_TEMP "FrameForge smoke cwd"
          $override = Join-Path $env:RUNNER_TEMP "FrameForge smoke override"
          Remove-Item $extract,$tools,$cwd,$override -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract,$tools,$cwd,$override | Out-Null
          Expand-Archive -Path "dist/${{ matrix.archive }}" -DestinationPath $extract -Force
          $package = Join-Path $extract "FrameForge"
          $exe = Join-Path $package "frameforge.exe"
          Set-Content -Path (Join-Path $tools "smoke.rs") -Value "fn main() {}"
          rustc --target x86_64-pc-windows-msvc -C target-feature=+crt-static (Join-Path $tools "smoke.rs") -o (Join-Path $tools "smoke.exe")
          foreach ($name in @("yt-dlp","ffmpeg","ffprobe","deno")) {
            Copy-Item (Join-Path $tools "smoke.exe") (Join-Path $tools "$name.exe") -Force
          }
          $env:Path = "$tools;$env:Path"
          Push-Location $cwd
          try {
            $doctor = & $exe doctor 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Packaged doctor failed: $doctor" }
            Set-Content -Path (Join-Path $override "sources.txt") -Value "# smoke"
            Copy-Item (Join-Path $package "profiles\default.json") (Join-Path $override "profile.json")
            $env:FRAMEFORGE_SOURCES = Join-Path $override "sources.txt"
            $env:FRAMEFORGE_PROFILE = Join-Path $override "profile.json"
            $overrideDoctor = & $exe doctor 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Environment override doctor failed: $overrideDoctor" }
            $env:FRAMEFORGE_ROOT = Join-Path $override "root"
            $env:FRAMEFORGE_OUTPUT = Join-Path $override "output"
            & $exe run 2>&1 | Out-Host
            if ($LASTEXITCODE -eq 0) { throw "Expected empty-source smoke run to fail." }
          } finally {
            Pop-Location
          }

      - name: Smoke-test packaged executable on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/FrameForge smoke package"
          tools="$RUNNER_TEMP/FrameForge smoke tools"
          cwd="$RUNNER_TEMP/FrameForge smoke cwd"
          override="$RUNNER_TEMP/FrameForge smoke override"
          rm -rf "$extract" "$tools" "$cwd" "$override"
          mkdir -p "$extract" "$tools" "$cwd" "$override"
          tar -xzf "dist/${{ matrix.archive }}" -C "$extract"
          package="$extract/FrameForge"
          exe="$package/frameforge"
          for name in yt-dlp ffmpeg ffprobe deno; do
            printf '#!/bin/sh\necho smoke\nexit 0\n' > "$tools/$name"
            chmod +x "$tools/$name"
          done
          export PATH="$tools:$PATH"
          pushd "$cwd" >/dev/null
          doctor="$("$exe" doctor 2>&1)"
          grep -E "^Sources:[[:space:]].*sources\.txt$" <<<"$doctor"
          grep -E "^Profile:[[:space:]].*profiles/default\.json$" <<<"$doctor"
          printf '# smoke\n' > "$override/sources.txt"
          cp "$package/profiles/default.json" "$override/profile.json"
          export FRAMEFORGE_SOURCES="$override/sources.txt"
          export FRAMEFORGE_PROFILE="$override/profile.json"
          override_doctor="$("$exe" doctor 2>&1)"
          grep -E "^Sources:[[:space:]].*sources\.txt$" <<<"$override_doctor"
          grep -E "^Profile:[[:space:]].*profile\.json$" <<<"$override_doctor"
          export FRAMEFORGE_ROOT="$override/root"
          export FRAMEFORGE_OUTPUT="$override/output"
          set +e
          "$exe" run >/tmp/frameforge-run.log 2>&1
          status=$?
          set -e
          cat /tmp/frameforge-run.log
          test "$status" -ne 0
          test -d "$FRAMEFORGE_ROOT"
          test -d "$FRAMEFORGE_OUTPUT"
          popd >/dev/null

      - name: Upload build package
        uses: actions/upload-artifact@v6
        with:
          name: FrameForge-${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: FrameForge-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
