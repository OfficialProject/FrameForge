name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: frameforge.exe
            archive: FrameForge-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: frameforge
            archive: FrameForge-linux-x64.tar.gz
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            binary: frameforge
            archive: FrameForge-macos-x64.tar.gz
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: frameforge
            archive: FrameForge-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable action
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify release binary
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --help

      - name: Prepare Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FrameForge | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/FrameForge/${{ matrix.binary }}"
          Copy-Item "profiles" "dist/FrameForge/profiles" -Recurse
          Copy-Item "sources.txt" "dist/FrameForge/sources.txt"
          Copy-Item "README.md" "dist/FrameForge/README.md"
          Copy-Item "LICENSE" "dist/FrameForge/LICENSE"
          Compress-Archive -Path "dist/FrameForge/*" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Prepare Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/FrameForge
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/FrameForge/${{ matrix.binary }}"
          cp -R profiles "dist/FrameForge/profiles"
          cp sources.txt README.md LICENSE "dist/FrameForge/"
          tar -C dist -czf "dist/${{ matrix.archive }}" FrameForge

      - name: Upload build package
        uses: actions/upload-artifact@v6
        with:
          name: FrameForge-${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: FrameForge-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
