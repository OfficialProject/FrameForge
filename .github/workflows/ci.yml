name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cs2-academy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Install Deno for YouTube JavaScript challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.0
      - name: Install yt-dlp with EJS support
        run: pipx install "yt-dlp[default]"
      - run: cargo fmt --all
      - run: cargo test --all-targets
      - run: cargo build --release
      - run: ./target/release/frameforge --help
      - run: ./target/release/frameforge discover --help
      - run: ./target/release/frameforge validate --help
      - name: Verify research runtime dependencies
        run: |
          yt-dlp --version
          deno --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          tesseract --version | head -n 1
  source-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify generic fork is gone
        run: |
          test ! -d src/adapters
          test ! -d src/processors
          test ! -d src/tools
          test ! -d test
          test ! -f package.json
          test ! -f package-lock.json
          test ! -f tsconfig.json
          test ! -f Dockerfile
          test -f Cargo.toml
          test -f src/main.rs
          test -f src/catalog.rs
          test -f src/validation.rs
